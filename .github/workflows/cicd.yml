name: Build And Push to ECR

on:
    push:
        branches: ["main"]


jobs:
    built_Scan:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout the Code
              uses: actions/checkout@v7

            - name: Trivy Scan
              uses: aquasecurity/trivy-action@v0.36.0
              with:
               scan-type: 'fs'
               severity: HIGH,CRITICAL
               exit-code: 1
            
            - name: Build Docker Image
              run: docker build -t 292398627491.dkr.ecr.us-east-1.amazonaws.com/my-repo:latest .

            - name: Scan Image with trivy
              uses: aquasecurity/trivy-action@0.28.0
              with:
                image-ref: 292398627491.dkr.ecr.us-east-1.amazonaws.com/my-repo:latest
                format: table
                exit-code: 1
                ignore-unifixed: true
                severity: CRITICAL,HIGH

            - name: Push image to ECR
              run: echo "push"
              
